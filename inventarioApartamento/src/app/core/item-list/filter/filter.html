<section class="my-6 mx-auto max-w-6xl px-6">
  <h2 class="text-xl font-semibold text-slate-900 mb-2">Enxoval</h2>
  <p class="text-slate-500 text-sm mb-4">
    Organize por cômodos e acompanhe compras, prioridades e gastos.
  </p>

  <!-- Linha principal: filtros (esquerda) + resumo (direita) -->
  <main class="flex items-stretch justify-between gap-6">
    <!-- Filtros -->
    <section class="flex-1 bg-white border border-slate-200 rounded-2xl shadow-sm p-4">
      <!-- Linha 1: Busca -->
      <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
        <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
        <input
          type="text"
          placeholder="Buscar item (ex: sofá, tapete...)"
          class="w-full bg-transparent outline-none text-slate-700 placeholder:text-slate-400"
        />
      </div>

      <!-- Linha 2: selects + botão -->
      <div class="mt-4 grid grid-cols-4 gap-3">
        <!-- Cômodo -->
        <select
          class="w-full rounded-xl bg-white border border-slate-200 px-4 py-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
        >
          <option value="">Todos os cômodos</option>
          <option value="">Sala</option>
          <option value="">Cozinha</option>
          <option value="">Banheiro</option>
          <option value="">Quarto</option>
        </select>

        <!-- Status -->
        <select
          class="w-full rounded-xl bg-white border border-slate-200 px-4 py-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
        >
          <option value="">Status: Todos</option>
          <option value="">Comprado</option>
          <option value="">Não comprado</option>
        </select>

        <!-- Prioridade -->
        <select
          class="w-full rounded-xl bg-white border border-slate-200 px-4 py-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
        >
          <option value="">Prioridade: Todas</option>
          <option value="">Alta</option>
          <option value="">Média</option>
          <option value="">Baixa</option>
        </select>

        <!-- Botão Buscar (ao lado da prioridade) -->
        <button
          class="w-full rounded-xl bg-slate-900 hover:bg-slate-800 px-4 py-3 text-white font-semibold transition cursor-pointer"
        >
          Buscar
        </button>
      </div>
    </section>

    <!-- Resumo de gastos -->
    <section class="w-[260px] flex flex-col gap-4">
      <!-- Total gasto -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl bg-emerald-50 flex items-center justify-center">
            <i class="fa-solid fa-bag-shopping text-emerald-600"></i>
          </div>
          <div>
            <p class="text-slate-500 text-sm">Total gasto</p>
            <p class="text-xl font-bold text-emerald-600">R$ 50.000</p>
          </div>
        </div>
      </div>

      <!-- Falta comprar -->
      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 rounded-2xl bg-orange-50 flex items-center justify-center">
            <i class="fa-solid fa-cart-shopping text-orange-500"></i>
          </div>
          <div>
            <p class="text-slate-500 text-sm">Falta comprar</p>
            <p class="text-xl font-bold text-orange-500">R$ 50.000</p>
          </div>
        </div>
      </div>
    </section>
  </main>
</section>
